function darker(hex, amt=45){
  const n = parseInt(hex.slice(1),16);
  const r = Math.max(0,(n>>16)-amt), g = Math.max(0,((n>>8)&255)-amt), b = Math.max(0,(n&255)-amt);
  return `rgb(${r},${g},${b})`;
}

let DB = loadDB();
function loadDB(){
  try{ const d = JSON.parse(localStorage.getItem("phonicsQuestSave")); if(d && d.profiles){ d.profiles.forEach(ensure); return d; } }catch(e){}
  return {profiles:[], current:null};
}
function saveDB(){ try{ localStorage.setItem("phonicsQuestSave", JSON.stringify(DB)); }catch(e){} try{ scheduleFileSave(); }catch(e){} }
function ensure(p){
  p.avatar = Object.assign({}, AV_DEFAULT, p.avatar||{});
  p.owned = p.owned || ["bg0"];
  ["bg0","t0"].forEach(id=>{ if(!p.owned.includes(id)) p.owned.push(id); });
  if(p.owned.includes("h2") && !p.owned.includes("ha1")) p.owned.push("ha1");
  p.equipped = p.equipped || {};
  if(p.equipped.hat==="h2"){ p.equipped.hairacc = "ha1"; delete p.equipped.hat; }
  if(p.equipped.outfit){ if(item(p.equipped.outfit) && item(p.equipped.outfit).slot==="costume") p.equipped.costume = p.equipped.outfit; delete p.equipped.outfit; }
  Object.keys(p.equipped).forEach(k=>{ const it = item(p.equipped[k]); if(!it){ delete p.equipped[k]; } else if(it.slot!==k){ delete p.equipped[k]; p.equipped[it.slot] = it.id; } });
  p.equipped.bg = p.equipped.bg || "bg0"; p.equipped.theme = p.equipped.theme || "t0";
  p.stats = p.stats || {}; p.done = p.done || {};
  p.prog = p.prog || {};
  CHS.forEach(k=>{ p.done[k] = p.done[k] || {}; p.prog[k] = p.prog[k] || 1; });
  p.c6 = p.c6 || {seen:{}, recent:[], count:0};
  p.daily = p.daily || {date:"", chapters:[], count:0};
  p.streak = p.streak || {last:"", n:0};
  p.points = p.points || 0;
  p.micMode = p.micMode || "grownup";
  p.created = p.created || new Date().toLocaleDateString("en-CA");
}
const P = () => DB.profiles.find(p=>p.id===DB.current);
function newProfile(name, avatar){
  const p = {id:"p"+Date.now(), name, avatar, points:0};
  ensure(p); DB.profiles.push(p); DB.current = p.id; saveDB(); return p;
}
function stat(key){ const p=P(); return p.stats[key] || (p.stats[key] = {ok:0, miss:0}); }
const isWeak = key => { const s = P().stats[key]; return s && s.miss > s.ok; };
const todayStr = () => new Date().toLocaleDateString("en-CA");
const yesterdayStr = () => new Date(Date.now()-864e5).toLocaleDateString("en-CA");
const addDaysStr = n => new Date(Date.now()+n*864e5).toLocaleDateString("en-CA");
const daysBetween = (a,b) => Math.floor((new Date(b)-new Date(a))/864e5);
function needBackup(p){
  if(typeof FS!=="undefined" && FS.state==="ready") return false;
  const base = p.lastBackup || p.created || todayStr();
  const played = p.points>0 || Object.values(p.done).some(d=>Object.keys(d).length);
  return played && daysBetween(base, todayStr()) >= 7 && todayStr() > (p.snoozeUntil||"");
}
function downloadBackup(){
  const p = P(); p.lastBackup = todayStr(); saveDB();
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:"application/json"}));
  a.download = "little-explorers-backup-"+todayStr()+".json"; a.click();
}

/* ---- Auto-save progress to a file on the computer (Chrome / Edge). Keeps progress outside the browser. ---- */
var FS = {handle:null, state:("showSaveFilePicker" in window)?"none":"unsupported", timer:null, last:""};
function idb(mode, fn){ return new Promise((res,rej)=>{ try{
  const rq = indexedDB.open("pq-files",1); rq.onupgradeneeded = ()=>rq.result.createObjectStore("h");
  rq.onsuccess = ()=>{ const db = rq.result, tx = db.transaction("h",mode), r = fn(tx.objectStore("h")); tx.oncomplete = ()=>{ db.close(); res(r && r.result); }; tx.onerror = ()=>{ db.close(); rej(tx.error); }; };
  rq.onerror = ()=>rej(rq.error); }catch(e){ rej(e); } }); }
async function fsInit(){
  if(FS.state==="unsupported") return;
  try{ const h = await idb("readonly", st=>st.get("file")); if(h){ FS.handle = h; FS.state = (await h.queryPermission({mode:"readwrite"}))==="granted" ? "ready" : "needs"; } }catch(e){}
  if(FS.state==="ready") fsWrite();
}
async function fsPick(){
  try{ const h = await showSaveFilePicker({suggestedName:"little-explorers-progress.json", types:[{description:"Little Explorers Quest progress", accept:{"application/json":[".json"]}}]});
    FS.handle = h; await idb("readwrite", st=>st.put(h,"file")); FS.state = "ready"; FS.last = ""; await fsWrite(); return true; }catch(e){ return false; }
}
async function fsAllow(){
  try{ FS.state = (await FS.handle.requestPermission({mode:"readwrite"}))==="granted" ? "ready" : "needs"; if(FS.state==="ready"){ FS.last = ""; await fsWrite(); } }catch(e){}
}
async function fsWrite(){
  if(FS.state!=="ready" || !FS.handle) return;
  try{ const txt = JSON.stringify(DB); if(txt===FS.last) return; const w = await FS.handle.createWritable(); await w.write(txt); await w.close(); FS.last = txt; }
  catch(e){ FS.state = "needs"; }
}
function scheduleFileSave(){ if(FS.state!=="ready") return; clearTimeout(FS.timer); FS.timer = setTimeout(fsWrite, 2500); }
async function fsRestore(){
  try{ if(FS.state!=="ready") await fsAllow(); const f = await FS.handle.getFile(), d = JSON.parse(await f.text());
    if(!d.profiles || !d.profiles.length) throw 0; d.profiles.forEach(ensure); DB = d; saveDB(); profilesScreen(); return true; }catch(e){ alert("Couldn't read the auto-save file."); return false; }
}
function dailyNow(p){ return p.daily.date===todayStr() ? p.daily : {date:todayStr(), chapters:[], count:0}; }

let voice = null;
function getVoice(){
  if(voice) return voice;
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  voice = vs.find(v=>/en[-_]AU/i.test(v.lang)) || vs.find(v=>/en[-_]GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
  return voice;
}
if(window.speechSynthesis) speechSynthesis.onvoiceschanged = ()=>{voice=null;getVoice();};
function speak(text, rate=0.8){
  if(!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = getVoice(); if(v) u.voice = v;
    u.rate = rate; u.lang = v ? v.lang : "en-AU";
    speechSynthesis.speak(u);
  }catch(e){}
}
let actx;
function tone(freqs, dur=0.12, type="sine"){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    tidyAudio();
    let t = actx.currentTime;
    freqs.forEach(f=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
      o.start(t); o.stop(t+dur); t += dur;
    });
  }catch(e){}
}
let audioIdle = null;
function tidyAudio(){ clearTimeout(audioIdle); audioIdle = setTimeout(()=>{ try{ if(actx && actx.state==="running") actx.suspend(); }catch(e){} }, 4000); }
document.addEventListener("visibilitychange", ()=>{ document.body.classList.toggle("paused", document.hidden); try{ if(document.hidden) speechSynthesis.cancel(); }catch(e){} });

// PIN is stored only as a salted, repeated SHA-256 hash (no plain text). To change it: run pinHash("newpin") in the browser console and paste the result into CONFIG.parentPinHash.
function sha256(s){const K=[];let p=2;while(K.length<64){let ok=1;for(let i=2;i*i<=p;i++)if(p%i==0){ok=0;break}if(ok)K.push((Math.cbrt(p)%1*4294967296)|0);p++}
let H=[];p=2;while(H.length<8){let ok=1;for(let i=2;i*i<=p;i++)if(p%i==0){ok=0;break}if(ok)H.push((Math.sqrt(p)%1*4294967296)|0);p++}
const b=unescape(encodeURIComponent(s)),l=b.length,w=[];for(let i=0;i<(((l*8+64>>9)<<4)+16);i++)w[i]=0;for(let i=0;i<l;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);w[l>>2]|=128<<(24-(l%4)*8);w[((l*8+64>>9)<<4)+15]=l*8;
for(let o=0;o<w.length;o+=16){const x=w.slice(o,o+16);for(let i=16;i<64;i++){const a=x[i-15],c=x[i-2];x[i]=(x[i-16]+((a>>>7|a<<25)^(a>>>18|a<<14)^(a>>>3))+x[i-7]+((c>>>17|c<<15)^(c>>>19|c<<13)^(c>>>10)))|0}
let[a,b2,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const t1=h+((e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7))+((e&f)^(~e&g))+K[i]+x[i],t2=((a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10))+((a&b2)^(a&c)^(b2&c));h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0}
H=[H[0]+a,H[1]+b2,H[2]+c,H[3]+d,H[4]+e,H[5]+f,H[6]+g,H[7]+h].map(v=>v|0)}
return H.map(v=>(v>>>0).toString(16).padStart(8,"0")).join("")}
function pinHash(pin){let h=pin;for(let i=0;i<5000;i++)h=sha256("pq-v1|"+h+"|"+pin);return h}
function askPin(msg){ const v = prompt(msg || "Grown-up PIN:"); return v!==null && pinHash(v.trim()) === CONFIG.parentPinHash; }

const optRow = (label,key,arr,cur) => `<div style="margin:8px 0"><b>${label}</b><div class="row">${arr.map(([k,n])=>`<button class="opt ${cur===k?"on":"ghost"}" data-sel="${key}" data-val="${k}">${n}</button>`).join("")}</div></div>`;
const swRow = (label,key,arr,cur) => `<div style="margin:8px 0"><b>${label}</b><div class="row">${arr.map((c,i)=>`<button class="sw ${cur===i?"on":""}" data-k="${key}" data-i="${i}" style="background:${c}"></button>`).join("")}</div></div>`;
function lookEditor(av){
  return swRow("Skin","skin",SKIN,av.skin) + optRow("Hair style","hair",HAIRS,av.hair) + swRow("Hair colour","hairColor",HAIRC,av.hairColor)
       + optRow("Eyes","eyes",EYES,av.eyes) + swRow("Eye colour","eyeColor",EYEC,av.eyeColor) + optRow("Smile","mouth",MOUTHS,av.mouth);
}
function clothesEditor(av){
  const d = av.dress==="none";
  return optRow("Dress or separates?","dress",DRESSES,av.dress)
    + (d ? optRow("Top","topStyle",TOPS,av.topStyle) + optRow("Bottoms","bottomStyle",BOTTOMS,av.bottomStyle) : "")
    + swRow(d?"Top colour":"Dress colour","top",TOPC,av.top)

  $$("[data-sel]").forEach(b=>b.onclick=()=>{ av[b.dataset.sel] = b.dataset.val; onChange(); });

function createProfile(){
  const draft = {name:"", avatar:Object.assign({}, AV_DEFAULT, {hair:"pigtails", eyes:"sparkle", top:0, topStyle:"tee", bottomStyle:"skirt", bottom:3, shoes:1})};
  function draw(){
    view(`<div class="card"><h1>✨ Make your player!</h1>
      <div class="closet"><div class="prev" id="prev">${avatarSVG({avatar:draft.avatar, equipped:{bg:"bg0"}}, 250)}</div>
      <div class="opts" style="text-align:left"><p style="margin:0 0 8px;text-align:center"><input type="text" id="nm" maxlength="14" placeholder="Your name" value="${esc(draft.name)}"></p>
      ${lookEditor(draft.avatar)}<hr style="border:none;border-top:3px dotted #ead9ff">${clothesEditor(draft.avatar)}</div></div>
      <div><button class="ok" id="go">Let's play! ▶</button>${DB.profiles.length?`<button class="ghost" id="cancel">Back</button>`:""}${(!DB.profiles.length && FS.handle)?`<div><button class="small alt" id="fsRest">📂 Restore from my auto-save file</button></div>`:""}</div></div>`, ()=>{
        const fr = $("#fsRest"); if(fr) fr.onclick = fsRestore;
        $("#nm").oninput = e=>{ draft.name = e.target.value; };
        bindBasics(draft.avatar, ()=>{ draft.name = $("#nm").value; const y=window.scrollY; draw(); window.scrollTo(0,y); });

          const name = ($("#nm").value||"").trim();
          if(!name){ $("#nm").focus(); $("#nm").style.borderColor="#e0455f"; return; }
          newProfile(name, draft.avatar); sndWin(); applyTheme(); home();
        };
        const c = $("#cancel"); if(c) c.onclick = profilesScreen;
      }, {bare:true});
  }
  draw();
}

const c6Ready = p => Object.keys(p.done.c3||{}).some(k=>p.done.c3[k]>=1);
const activeChs = p => CHS.filter(ch=>ch!=="c6" || c6Ready(p));
function todayLevel(p, ch){ return Math.min(p.prog[ch], CH[ch].max); }
function home(){
  backTo = null;
  const p = P(); if(!p) return profilesScreen();
  applyTheme();
  const d = dailyNow(p), goalDone = d.count >= 1;
  const streak = (p.streak.last===todayStr() || p.streak.last===yesterdayStr()) ? p.streak.n : 0;
  const nextItem = ITEMS.filter(i=>!p.owned.includes(i.id) && i.cost>0).sort((a,b)=>a.cost-b.cost)[0];
  view(`
    ${FS.state==="needs"?`<div class="card" style="background:#fff8d6"><b>💾 Auto-save is paused.</b> Tap to turn it back on so progress is saved to your file.<div><button class="ok small" id="fsOn">Turn auto-save on</button></div></div>`:""}

    <div class="card">
      <div id="av" style="cursor:pointer">${avatarSVG(p,270,moodNow)}</div>
      <h1>Hi ${esc(p.name)}!</h1>
      <div>${streak?`<span class="pill">🔥 ${streak} day${streak>1?"s":""} in a row</span>`:""}<span class="pill">${goalDone?"✅ Today's goal done!":"🎯 Goal: finish 1 level today"}</span></div>
      ${nextItem?`<p style="font-size:18px;margin:8px 0 4px">Saving up for <b>${nextItem.icon} ${nextItem.name}</b>: ${Math.max(0,nextItem.cost-p.points)} ⭐ to go</p>
        <div class="bar" style="max-width:360px;margin:0 auto"><div style="width:${Math.min(100,p.points/nextItem.cost*100)}%"></div></div>`:`<p>You own everything! 🏆</p>`}
      <button class="ok" id="closet">👗 My Avatar &amp; Shop</button>
    </div>
    <div class="card" style="text-align:left"><h2 style="text-align:center">🗓️ Today's Quest</h2>
      <p style="text-align:center;font-size:18px;margin-top:0">Finish at least one level today. Do more for bonus stars!</p>
      ${CHS.map(ch=>{
        const lv = todayLevel(p,ch), done = d.chapters.includes(ch), st = p.done[ch][lv]||0;
        if(ch==="c6" && !c6Ready(p)) return `<div class="card ch" style="margin:8px 0;padding:12px;opacity:.7"><div><h3>${CH[ch].icon} ${CH[ch].name} 🔒</h3><div style="font-size:16px">Finish a Digraph Lesson (Chapter 3) to unlock the daily test.</div></div></div>`;
        return `<div class="card ch ${done?"":"today"}" style="margin:8px 0;padding:12px"><div><h3>${CH[ch].icon} ${CH[ch].name} ${done?"✅":""}</h3>
          <div style="font-size:16px">${CH[ch].about}</div><div style="font-size:18px"><b>${CH[ch].daily?"Today's test":"Today: Level "+lv}</b> ${"⭐".repeat(st)}</div></div>
          <div style="text-align:center"><button class="ok" data-play="${ch}">${done?"Again":"Play"} ▶</button>${CH[ch].daily?"":`<br><button class="small ghost" data-menu="${ch}">All levels</button>`}</div></div>`;
      }).join("")}
    </div>
    <div class="row"><button class="small ghost" id="switch">👥 Switch player</button><button class="small ghost" id="grown">👩‍👧 Grown-up corner</button></div>
  `, ()=>{
    $("#closet").onclick = $("#av").onclick = closet;

    $$("[data-menu]").forEach(b=>b.onclick=()=>MENU[b.dataset.menu]());

}

let closetTab = "look";
function shopGrid(slot){
  const p = P(), req = slot==="bg"||slot==="theme";
  return `<div class="grid">${ITEMS.filter(i=>i.slot===slot).map(it=>{
    const own = p.owned.includes(it.id), on = p.equipped[slot]===it.id, can = p.points>=it.cost;
    return `<div class="item"><div style="font-size:42px">${it.icon}</div><div>${it.name}</div>
      ${own ? `<button class="small ${on?"alt":"ok"}" data-eq="${it.id}">${on?(req?"In use":"Take off"):"Use it"}</button>`
            : `<button class="small" data-buy="${it.id}" ${can?"":"disabled"}>⭐ ${it.cost}</button>${can?"":`<div style="font-size:14px">${it.cost-p.points} more to go</div>`}`}</div>`;
  }).join("")}</div>`;
}
function closet(){
  const p = P();
  const tabs = CLOSET_TABS.map(([k,n])=>`<button class="opt ${closetTab===k?"on":"ghost"}" data-tab="${k}">${n}</button>`).join("");
  let body = "";
  if(closetTab==="look") body += `<div class="card" style="text-align:left">${lookEditor(p.avatar)}</div>`;
  if(closetTab==="clothes") body += `<div class="card" style="text-align:left"><h3 style="text-align:center">My clothes</h3>${p.equipped.costume?`<p style="text-align:center;font-size:16px">A glam outfit is on. Take it off in "Glam outfits" below to show these clothes.</p>`:""}${clothesEditor(p.avatar)}</div>`;
  (TAB_SLOTS[closetTab]||[]).forEach(slot=>{ body += `<div class="card"><h3>${SLOTS[slot]}</h3>${shopGrid(slot)}</div>`; });
  view(`<div class="closet"><div class="prev card"><h2>My Avatar</h2><div>${avatarSVG(p,260,moodNow)}</div><p style="font-size:20px;margin:6px">You have <b>⭐ ${p.points}</b></p><button class="ok" id="done">✔ Done</button></div>
    <div class="opts"><div class="row" style="margin-bottom:10px">${tabs}</div>${body}</div></div>`, ()=>{
    const keep = fn => { const y=window.scrollY; fn(); window.scrollTo(0,y); };
    $$("[data-tab]").forEach(b=>b.onclick=()=>{ closetTab = b.dataset.tab; keep(closet); });
    $("#done").onclick = home;
    bindBasics(p.avatar, ()=>{ saveDB(); keep(closet); });
    $$("[data-buy]").forEach(b=>b.onclick=()=>{
      const it = item(b.dataset.buy);
      if(p.points>=it.cost){ p.points-=it.cost; p.owned.push(it.id); p.equipped[it.slot]=it.id; saveDB(); sndWin(); confetti(16); applyTheme(); keep(closet); }
    });
    $$("[data-eq]").forEach(b=>b.onclick=()=>{
      const it = item(b.dataset.eq), req = it.slot==="bg"||it.slot==="theme";
      if(p.equipped[it.slot]===it.id){ if(!req) delete p.equipped[it.slot]; } else p.equipped[it.slot]=it.id;
      saveDB(); applyTheme(); keep(closet);
    });
  });
}

/* =============================================================
   LEVEL MENUS, PROGRESS AND FINISH SCREEN
   ============================================================= */
const MENU = {}, RUN = {};
function levelMenu(ch, rows){
  backTo = null;
  const p = P(), cur = todayLevel(p, ch);
  view(`<div class="card"><h2>${CH[ch].icon} ${CH[ch].name}</h2><p style="font-size:18px">${CH[ch].about}</p>
    ${rows.map((r,i)=>{
      const lv = i+1, st = p.done[ch][lv]||0, locked = lv > cur;
      return `<div class="card ch ${lv===cur?"today":""}" style="margin:8px 0;padding:12px"><div><h3>Level ${lv}${lv===cur?" ⭐ Today":""}</h3><div style="font-size:16px">${r}</div><div style="font-size:22px">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div></div>
        <button class="${locked?"ghost":"ok"}" data-lv="${lv}" ${locked?"disabled":""}>${locked?"🔒":"Play ▶"}</button></div>`;
    }).join("")}</div>`, ()=>{ $$("[data-lv]").forEach(b=>b.onclick=()=>{ backTo = ()=>MENU[ch](); RUN[ch](+b.dataset.lv); }); });
}

function recordLevelDone(ch, level, stars){
  const p = P(), notes = [], d = todayStr();
  p.done[ch][level] = Math.max(stars, p.done[ch][level]||0);
  if(p.daily.date !== d) p.daily = {date:d, chapters:[], count:0};
  const firstToday = p.daily.count === 0;
  p.daily.count++;
  if(!p.daily.chapters.includes(ch)) p.daily.chapters.push(ch);
  if(firstToday){
    p.streak.n = (p.streak.last===yesterdayStr()) ? p.streak.n+1 : 1; p.streak.last = d;
    addPoints(CONFIG.dailyBonus); notes.push(`🎯 Daily goal done! +${CONFIG.dailyBonus} ⭐  🔥 ${p.streak.n} day${p.streak.n>1?"s":""} in a row`);
  }
  if(activeChs(p).every(c=>p.daily.chapters.includes(c)) && !p.daily.allBonus){ p.daily.allBonus = true; addPoints(CONFIG.allChaptersBonus); notes.push(`🌟 Every chapter done today! +${CONFIG.allChaptersBonus} ⭐`); }
  if(CH[ch].daily){ /* daily test: no levels to unlock */ }
  else if(level === p.prog[ch] && stars >= 2 && p.prog[ch] < CH[ch].max){ p.prog[ch]++; notes.push(`🔓 Level ${p.prog[ch]} unlocked in ${CH[ch].name}!`); }
  else if(level === p.prog[ch] && stars < 2) notes.push(`Try level ${level} again to unlock the next one. You can do it!`);
  saveDB(); return notes;
}
function finishScreen(ch, level, run, ratio, hi=0.8, mid=0.5){
  const stars = ratio>hi?3:ratio>mid?2:1, bonus = 10 + stars*5;
  addPoints(bonus);
  const notes = recordLevelDone(ch, level, stars), p = P();
  const nextLevel = (level < CH[ch].max && level+1 <= p.prog[ch]) ? level+1 : level;
  sndWin(); confetti();
  view(`<div class="card"><h1>🎉 Level complete! 🎉</h1><div>${avatarSVG(p,230,"cheer")}</div>
    <div style="font-size:44px">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
    <p style="font-size:24px">You earned <b>${run.pts+bonus} ⭐</b> (${bonus} bonus!)</p>
    ${notes.map(n=>`<div class="pill">${n}</div>`).join("")}
    <div><button class="ok" id="next">${nextLevel>level ? "Next level ▶" : "Play again"}</button><button id="shop">👗 Visit the shop</button><button class="ghost" id="menu">Levels</button><button class="ghost" id="hm">🏠 Home</button></div></div>`, ()=>{
      $("#next").onclick = ()=>RUN[ch](nextLevel); $("#shop").onclick = closet; $("#menu").onclick = MENU[ch]; $("#hm").onclick = home;
    });
}

/* =============================================================
   SHARED SPELLING STEP (type a whole word, optionally say it first)
   o: {word, emoji, title, progress, hint, say (offer microphone), noAudio (picture quest)}
   cb(result): {mistakes, said, usedHint}
   ============================================================= */
function spellStep(o, cb){
  const word = o.word, useMic = !!SR && P().micMode==="mic";
  let pos = 0, mistakes = 0, wrongHere = 0, flash = false, done = false, said = false, usedHint = false, listening = false, sayMsg = "";
  function draw(msg, cls){
    const sayBtn = !o.say ? "" : useMic
      ? `<button class="${listening?"alt pulse":"ghost"}" id="sayit" ${done||said?"disabled":""}>🎤 ${said?"You said it! ✅":listening?"Listening…":"Say it"}</button>`
      : `<button class="${said?"ok":"ghost"}" id="sayit" ${done||said?"disabled":""}>👩‍👧 ${said?"She said it! ✅":"She said it"}</button>`;
    view(`<div class="card"><h2>${o.title}</h2>
      <div class="bar"><div style="width:${o.progress*100}%"></div></div>
      ${o.emoji?`<div class="big" style="margin-top:8px">${o.emoji}</div>`:`<div class="big">🔊</div>`}
      <div style="font-size:18px;min-height:26px">${o.hint||""}${o.say&&!useMic?" A grown-up taps “She said it” for bonus stars.":""}</div>
      <div class="row">${sayBtn}<button class="ghost" id="hear">🔊 ${o.noAudio&&!usedHint?"Hint: hear it":"Hear the word"}</button></div>
      <div class="letters">${word.split("").map((c,k)=>`<div class="lt ${word.length>6?"sm":""} ${k<pos?"good":(k===pos&&flash?"bad":(k===pos?"blank active":"blank"))}">${k<pos?c:""}</div>`).join("")}</div>
      <div class="msg ${cls||""}">${sayMsg&&!msg?sayMsg:(msg||"")}</div>
      <div class="keys">${"abcdefghijklmnopqrstuvwxyz".split("").map(c=>`<button data-c="${c}">${c}</button>`).join("")}</div></div>`, ()=>{
        $("#hear").onclick = ()=>{ usedHint = true; speak(word); };
        const sb = $("#sayit"); if(sb) sb.onclick = sayIt;
        $$(".keys button").forEach(b=>b.onclick=()=>press(b.dataset.c));
        document.onkeydown = e=>{ if(e.key.length===1 && /[a-z]/i.test(e.key)) press(e.key.toLowerCase()); };
      });
  }
  function sayIt(){
    if(listening || said || done) return;
    if(!useMic){ said = true; sayMsg = "Great saying it! Now spell it."; sndGood(); draw(); return; }
    listening = true; sayMsg = "🎧 Listening…"; draw();
    const wd = setTimeout(()=>{ if(listening){ listening = false; stopListening(); sayMsg = micMessage("not-allowed"); draw(); } }, 8000); timers.push(wd);
    listen(alts=>{
      clearTimeout(wd); listening = false;
      if(heard(alts, word.toLowerCase())){ said = true; sayMsg = "I heard you say it! Now spell it."; sndGood(); }
      else sayMsg = `I heard “${alts[0]}”. Try again, or just spell it!`;
      draw();
    }, err=>{ clearTimeout(wd); listening = false; sayMsg = micMessage(err); draw(); });
  }
  function press(c){
    if(done) return;
    if(c === word[pos].toLowerCase()){
      pos++; wrongHere = 0; sndGood();
      if(pos >= word.length){
        done = true; speak(word); draw(`${word}!`, "good-t");
        later(()=>cb({mistakes, said, usedHint}), 1500);
      } else draw();
    } else {
      mistakes++; wrongHere++; sndBad();
      if(wrongHere >= 3){
        pos++; wrongHere = 0; speak(word);
        if(pos >= word.length){ done = true; draw(`The word is ${word}. Say it with me!`, "bad-t"); later(()=>cb({mistakes, said, usedHint}), 2500); return; }
        draw("I'll help with that letter. Keep going!", "bad-t");
      } else { flash = true; draw("Not that letter. Try again!", "bad-t"); later(()=>{ flash = false; draw(); }, 700); }
    }
  }
  draw();
  if(!o.noAudio) later(()=>speak(word), 250);
}
function spellPoints(r, base=10){
  let pts = r.mistakes===0 ? base : r.mistakes<=2 ? Math.round(base*0.6) : Math.round(base*0.3);
  if(r.said) pts += 3;
  if(r.usedHint) pts = Math.max(2, pts-3);
  return pts;
}

/* =============================================================
   CHAPTER 1: MISSING LETTERS (1 to 3 blanks per word)
   ============================================================= */
MENU.c1 = ()=>levelMenu("c1", WORD_LEVELS.map(l=>`${l.name} · ${l.blanks} missing letter${l.blanks>1?"s":""}`));
RUN.c1 = level=>{
  const L = WORD_LEVELS[level-1], nbMax = Math.min(L.blanks, 3);
  const pool = uniq(L.words), weak = pool.filter(w=>isWeak("w:"+w));
  const qs = uniq([...pick(weak,3), ...shuffle(pool)]).slice(0, CONFIG.questionsPerRound);
  const run = {pts:0, first:0}; let i = 0;
  function q(){
    if(i >= qs.length) return finishScreen("c1", level, run, run.first/qs.length);
    const w = qs[i], nb = Math.min(nbMax, Math.max(1, w.length-2));
    const idxs = pick([...Array(w.length).keys()], nb).sort((a,b)=>a-b);
    let cur = 0, mistakes = 0, wrongHere = 0, flash = false, done = false;
    function draw(msg, cls){
      view(`<div class="card"><h2>Missing Letters ${i+1}/${qs.length}</h2>
        <div class="bar"><div style="width:${i/qs.length*100}%"></div></div>
        ${L.rule?`<div class="rulebox">📘 ${L.rule}</div>`:""}<p style="font-size:20px;margin-bottom:0">Listen, then type the ${nb>1?nb+" ":""}missing letter${nb>1?"s":""}!</p>
        <button id="say">🔊 Hear the word</button>
        <div class="letters">${w.split("").map((ch,k)=>{
          const bi = idxs.indexOf(k), sm = w.length>7?"sm":"";
          if(bi<0) return `<div class="lt ${sm}">${ch}</div>`;
          if(bi<cur||done) return `<div class="lt good ${sm}">${ch}</div>`;
          return `<div class="lt ${sm} ${bi===cur?(flash?"bad":"blank active"):"blank"}">?</div>`;
        }).join("")}</div>
        <div class="msg ${cls||""}">${msg||""}</div>
        <div class="keys">${"abcdefghijklmnopqrstuvwxyz".split("").map(c=>`<button data-c="${c}">${c}</button>`).join("")}</div></div>`, ()=>{
          $("#say").onclick = ()=>speak(w);
          $$(".keys button").forEach(b=>b.onclick=()=>press(b.dataset.c));
          document.onkeydown = e=>{ if(e.key.length===1 && /[a-z]/i.test(e.key)) press(e.key.toLowerCase()); };
        });
    }
    function press(c){
      if(done) return;
      if(c === w[idxs[cur]]){
        cur++; wrongHere = 0; sndGood();
        if(cur >= nb){ finishWord(); } else draw(`Good! ${nb-cur} to go.`, "good-t");
      } else {
        mistakes++; wrongHere++; sndBad();
        if(wrongHere >= 3){ cur++; wrongHere = 0; speak(w); if(cur>=nb){ finishWord(); } else draw("I'll help with that one. Keep going!", "bad-t"); }
        else { flash = true; draw("Not quite. Listen and try again!", "bad-t"); speak(w); later(()=>{ flash=false; draw(); }, 800); }
      }
    }
    function finishWord(){
      done = true;
      const base = 8 + 2*nb, pts = mistakes===0 ? base : mistakes<=2 ? Math.round(base*0.6) : Math.round(base*0.3);
      if(mistakes===0){ run.first++; stat("w:"+w).ok++; } else stat("w:"+w).miss++;
      run.pts += pts; addPoints(pts); speak(w);
      draw(`Yes! ${w} (+${pts} ⭐)`, "good-t"); later(()=>{ i++; q(); }, 1500);
    }
    draw(); later(()=>speak(w), 250);
  }
  q();
};

/* =============================================================
   CHAPTER 2: SAY THE SOUNDS (microphone)
   ============================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;
function stopListening(){ try{ if(recog){ recog.onresult=recog.onerror=recog.onend=recog.onstart=null; recog.abort(); } }catch(e){} recog = null; }
function listen(onAlts, onFail, onStart){
  stopListening();
  let finished = false;
  const fail = code => { if(!finished){ finished = true; onFail(code); } };
  try{
    recog = new SR(); recog.lang = "en-AU"; recog.interimResults = false; recog.maxAlternatives = 5; recog.continuous = false;
    recog.onstart = ()=>{ if(onStart) onStart(); };
    recog.onresult = e=>{ if(finished) return; finished = true; onAlts([...e.results[0]].map(a=>a.transcript.toLowerCase())); };
    recog.onerror = e=>fail(e.error || "error");
    recog.onend = ()=>fail("no-speech");
    recog.start();
  }catch(e){ fail("error"); }
}
function micMessage(code){
  switch(code){
    case "not-allowed": case "service-not-allowed": return "The browser blocked the microphone. Click the 🔒 or 🎤 icon next to the address bar, choose Allow, then reload this page.";
    case "audio-capture": return "No microphone was found. Check that one is plugged in and chosen in Windows Sound settings.";
    case "network": return "The browser's speech service could not be reached. It needs the internet, and often fails when the game is opened as a file. See the mic help.";
    case "no-speech": return "I didn't hear anything. Tap the mic and speak a bit louder.";
    case "language-not-supported": return "The browser doesn't support this language for listening.";
    default: return "Listening didn't work ("+code+"). See the mic help.";
  }
}
function heard(alts, key){
  const words = alts.join(" ").replace(/[^a-z\s'-]/g," ").split(/\s+/);
  return words.includes(key) || words.includes(key+"s");
}
function setMicMode(on){ const p = P(); p.micMode = on ? "mic" : "grownup"; saveDB(); }
MENU.c2 = ()=>{

    ${on?`<div><button class="small" id="micTest">🎤 Test microphone</button></div><div id="micOut" style="font-size:18px;min-height:24px"></div>
    <details style="text-align:left;font-size:16px"><summary>Mic help</summary><ol>
      <li>Use <b>Chrome</b> or <b>Edge</b> and be online.</li><li>Click <b>Allow</b> when asked for the microphone.</li>
      <li>If it fails when opened as a file, host the game at a normal web address (for example Netlify Drop).</li>

RUN.c2 = group=>{
  const qs = shuffle(SOUND_GROUPS[group]).slice(0, CONFIG.soundsPerRound);

/* =============================================================
   CHAPTER 3: DIGRAPH LESSONS (meet, sort by sound, spell)
   ============================================================= */
const hlWord = (L,w)=>{ const i = L.atEnd ? w.lastIndexOf(L.dg) : w.indexOf(L.dg); return i<0 ? w : w.slice(0,i)+`<span class="hl">${L.dg}</span>`+w.slice(i+L.dg.length); };
MENU.c3 = ()=>levelMenu("c3", LESSONS.map(l=>`<span class="dgname" style="font-size:34px">“${l.dg}”</span> · ${l.sounds.length} sound${l.sounds.length>1?"s":""}`));
RUN.c3 = level=>{
  const L = LESSONS[level-1];
  const all = L.sounds.flatMap((s,si)=>s.words.map(([w,e])=>({w, e, si})));
  const sortQs = (()=>{
    const per = Math.max(1, Math.floor(8/L.sounds.length)); let out = [];
    L.sounds.forEach((s,si)=>{ out.push(...pick(all.filter(x=>x.si===si), Math.min(per, s.words.length))); });
    const weak = all.filter(x=>isWeak("x:"+x.w) && !out.includes(x));
    out = out.concat(pick(weak,2));
    const rest = shuffle(all.filter(x=>!out.includes(x)));
    while(out.length < 8 && rest.length) out.push(rest.pop());
    return shuffle(out).slice(0,8);
  })();
  const spellQs = shuffle(all.filter(x=>x.e)).concat(shuffle(all.filter(x=>!x.e))).slice(0,6);
  const run = {pts:0, sortFirst:0, spellFirst:0};

  function meet(){
    view(`<div class="card"><h2>📗 Lesson ${level}</h2><div class="dgname">“${L.dg}”</div><p style="font-size:22px">${L.intro}</p>
      ${L.sounds.map((s,si)=>`<div class="item" style="margin:10px 0"><div style="font-size:24px"><b class="hl">${L.dg}</b> says <b>${s.say}</b> <span style="font-size:34px">${s.keyPic}</span></div>
        <div>${s.words.map(([w,e])=>`<button class="ghost wordbtn" data-w="${w}">${e} ${hlWord(L,w)}</button>`).join("")}</div></div>`).join("")}
      <p style="font-size:18px">Tap a word to hear it!</p>
      <button class="ok" id="go">I'm ready ▶</button></div>`, ()=>{
        $$("[data-w]").forEach(b=>b.onclick=()=>speak(b.dataset.w));
        $("#go").onclick = sort;
      });
  }
  function sort(){
    let i = 0;
    function q(){
      if(i >= sortQs.length) return spell();
      const x = sortQs[i]; let attempts = 0, done = false, wrongSet = [];
      function draw(msg, cls){
        view(`<div class="card"><h2>Which sound? ${i+1}/${sortQs.length}</h2>
          <div class="bar"><div style="width:${i/sortQs.length*100}%"></div></div>
          ${x.e?`<div class="big">${x.e}</div>`:""}
          <div class="giant" style="font-size:64px;color:#33265a;margin:6px">${hlWord(L,x.w)}</div>
          <button id="say">🔊 Hear the word</button>
          <p style="font-size:20px;margin:6px">What sound does <b class="hl">${L.dg}</b> make here?</p>
          <div class="msg ${cls||""}">${msg||""}</div>
          <div class="row">${L.sounds.map((s,si)=>`<button class="ghost" style="font-size:22px" data-s="${si}" ${done||wrongSet.includes(si)?"disabled":""}>${s.keyPic} ${s.say}</button>`).join("")}</div></div>`, ()=>{
            $("#say").onclick = ()=>speak(x.w);
            $$("[data-s]").forEach(b=>b.onclick=()=>choose(+b.dataset.s));
          });
      }
      function choose(si){
        if(done) return;
        if(si === x.si){
          done = true; const pts = attempts===0?8:attempts===1?4:2; if(attempts===0){ run.sortFirst++; stat("x:"+x.w).ok++; }
          run.pts += pts; addPoints(pts); sndGood(); speak(x.w);
          draw(`Yes! ${L.dg} says “${L.sounds[x.si].say}” in ${x.w}. +${pts} ⭐`, "good-t"); later(()=>{ i++; q(); }, 1700);
        } else {
          attempts++; wrongSet.push(si); sndBad(); if(attempts===1) stat("x:"+x.w).miss++;
          if(attempts >= L.sounds.length-1 || attempts>=3){ done = true; draw(`In ${x.w}, ${L.dg} says “${L.sounds[x.si].say}”.`, "bad-t"); speak(x.w); later(()=>{ i++; q(); }, 2600); }
          else { draw("Not quite. Listen again and try!", "bad-t"); speak(x.w); }
        }
      }
      draw(); later(()=>speak(x.w), 250);
    }
    q();
  }
  function spell(){
    let i = 0;
    function q(){
      if(i >= spellQs.length) return finishScreen("c3", level, run, (run.sortFirst/sortQs.length*0.5 + run.spellFirst/spellQs.length*0.5), 0.75, 0.5);
      const x = spellQs[i], s = L.sounds[x.si];
      spellStep({word:x.w, emoji:x.e, title:`✏️ Spell it ${i+1}/${spellQs.length}`, progress:i/spellQs.length, hint:`Listen for <b class="hl">${L.dg}</b> (${s.say})`}, r=>{
        const pts = spellPoints(r, 10); if(r.mistakes===0){ run.spellFirst++; stat("x:"+x.w).ok++; } else stat("x:"+x.w).miss++;
        run.pts += pts; addPoints(pts); i++; q();
      });
    }
    q();
  }
  meet();
};

/* =============================================================
   CHAPTER 6: DIGRAPH DAILY TEST (revisits every sound learned in Chapter 3)
   Each day it picks the sounds tested least recently (and any she finds hard),
   asks which sound the digraph makes, then spells a few of the words.
   ============================================================= */
MENU.c6 = ()=>home();
RUN.c6 = ()=>{
  const p = P(); p.c6 = p.c6 || {seen:{}, recent:[], count:0};
  const lessons = LESSONS.map((L,i)=>({L,i})).filter(x=>(p.done.c3[x.i+1]||0)>=1);
  if(!lessons.length) return home();
  const pairs = lessons.flatMap(({L})=>L.sounds.map((sd,si)=>({L, si, key:L.dg+":"+si})));
  const isHard = x => x.L.sounds[x.si].words.some(([w])=>isWeak("x:"+w));
  const order = shuffle(pairs).map(x=>({x, t: isHard(x) ? "" : (p.c6.seen[x.key]||"")})).sort((a,b)=>a.t<b.t?-1:a.t>b.t?1:0).map(o=>o.x);
  const chosen = order.slice(0, Math.min(8, order.length));
  const used = new Set(), qs = [];
  for(let i=0; qs.length<8 && i<40; i++){
    const x = chosen[i % chosen.length], ws = x.L.sounds[x.si].words.filter(([w])=>!used.has(w));
    if(!ws.length){ if(i>=chosen.length*3) break; continue; }
    const fresh = ws.filter(([w])=>!p.c6.recent.includes(w)), src = fresh.length ? fresh : ws;
    const [w,e] = pick(src,1)[0]; used.add(w); qs.push({w, e, L:x.L, si:x.si, key:x.key});
  }
  const sortQs = shuffle(qs);
  const spellQs = shuffle(qs.filter(q=>q.e)).concat(shuffle(qs.filter(q=>!q.e))).slice(0, Math.min(4, qs.length));
  const run = {pts:0, sortFirst:0, spellFirst:0};
  const mark = q=>{ p.c6.seen[q.key] = todayStr(); p.c6.recent.push(q.w); if(p.c6.recent.length>80) p.c6.recent.shift(); };

  function intro(){
    const dgs = [...new Set(chosen.map(x=>x.L.dg))];
    view(`<div class="card"><h1>🧪 Digraph Daily Test</h1>
      <p style="font-size:22px">Today we practise these digraphs. Which sound do they make?</p>
      <div>${dgs.map(d=>`<span class="dgname" style="margin:0 10px">“${d}”</span>`).join("")}</div>
      <p style="font-size:18px">${sortQs.length} listening questions, then ${spellQs.length} spelling words.</p>
      <button class="ok" id="go">Start ▶</button></div>`, ()=>{ $("#go").onclick = sort; });
  }
  function sort(){
    let i = 0;
    function q(){
      if(i >= sortQs.length) return spell();
      const x = sortQs[i], L = x.L; let attempts = 0, done = false, wrongSet = [];
      function draw(msg, cls){
        view(`<div class="card"><h2>🧪 Which sound? ${i+1}/${sortQs.length}</h2>
          <div class="bar"><div style="width:${i/sortQs.length*100}%"></div></div>
          ${x.e?`<div class="big">${x.e}</div>`:""}
          <div class="giant" style="font-size:64px;color:#33265a;margin:6px">${hlWord(L,x.w)}</div>
          <button id="say">🔊 Hear the word</button>
          <p style="font-size:20px;margin:6px">What sound does <span class="dgname" style="font-size:30px">“${L.dg}”</span> make here?</p>
          <div class="msg ${cls||""}">${msg||""}</div>
          <div class="row">${L.sounds.map((sd,k)=>`<button class="ghost" style="font-size:22px" data-s="${k}" ${done||wrongSet.includes(k)?"disabled":""}>${sd.keyPic} ${sd.say}</button>`).join("")}</div></div>`, ()=>{
            $("#say").onclick = ()=>speak(x.w);
            $$("[data-s]").forEach(b=>b.onclick=()=>choose(+b.dataset.s));
          });
      }
      function choose(k){
        if(done) return;
        if(k === x.si){
          done = true; const pts = attempts===0?8:attempts===1?4:2; if(attempts===0){ run.sortFirst++; stat("x:"+x.w).ok++; }
          mark(x); run.pts += pts; addPoints(pts); sndGood(); speak(x.w);
          draw(`Yes! ${L.dg} says “${L.sounds[x.si].say}” in ${x.w}. +${pts} ⭐`, "good-t"); later(()=>{ i++; q(); }, 1700);
        } else {
          attempts++; wrongSet.push(k); sndBad(); if(attempts===1) stat("x:"+x.w).miss++;
          if(attempts >= L.sounds.length-1 || attempts>=3){ done = true; mark(x); draw(`In ${x.w}, ${L.dg} says “${L.sounds[x.si].say}”.`, "bad-t"); speak(x.w); later(()=>{ i++; q(); }, 2600); }
          else { draw("Not quite. Listen again and try!", "bad-t"); speak(x.w); }
        }
      }
      draw(); later(()=>speak(x.w), 250);
    }
    q();
  }
  function spell(){
    let i = 0;
    function q(){
      if(i >= spellQs.length){ p.c6.count = (p.c6.count||0)+1; return finishScreen("c6", 1, run, (run.sortFirst/sortQs.length*0.6 + run.spellFirst/spellQs.length*0.4), 0.8, 0.5); }
      const x = spellQs[i], sd = x.L.sounds[x.si];
      spellStep({word:x.w, emoji:x.e, title:`✏️ Spell it ${i+1}/${spellQs.length}`, progress:i/spellQs.length, hint:`Listen for <b class="hl">${x.L.dg}</b> (${sd.say})`}, r=>{
        const pts = spellPoints(r, 10); if(r.mistakes===0){ run.spellFirst++; stat("x:"+x.w).ok++; } else stat("x:"+x.w).miss++;
        run.pts += pts; addPoints(pts); i++; q();
      });
    }
    q();
  }
  intro();
};

/* =============================================================
   CHAPTER 7: MATHS MAGIC (questions are generated fresh from maths.js)
   ============================================================= */
MENU.c7 = ()=>levelMenu("c7", MATH_LEVELS.map(l=>l.name));
RUN.c7 = level=>{
  const L = MATH_LEVELS[level-1], N = 10;
  const weak = L.gens.filter(g=>isWeak("m:"+g[0]));
  const order = []; let cyc = [];
  for(let i=0;i<N;i++){
    if(!cyc.length) cyc = shuffle(L.gens);
    order.push((i<2 && weak.length) ? pick(weak,1)[0] : cyc.pop());
  }
  const qs = []; 
  order.forEach(g=>{ let q, t = 0; do{ q = MATH_GEN[g[0]](...g.slice(1)); t++; }while(qs.some(o=>o.q===q.q) && t<8); q.key = g[0]; qs.push(q); });
  const run = {pts:0, first:0};
  let i = 0;
  function ask(){
    if(i >= qs.length) return finishScreen("c7", level, run, run.first/qs.length, 0.8, 0.5);
    const x = qs[i]; let attempts = 0, done = false, typed = "", wrongOpts = [];
    function draw(msg, cls){
      const body = x.type==="num"
        ? `<div class="numans">${typed||"&nbsp;"}</div>
           <div class="numpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="ghost" data-n="${n}">${n}</button>`).join("")}<button class="ghost" id="del">⌫</button><button class="ghost" data-n="0">0</button><button class="ok" id="go" ${!typed||done?"disabled":""}>✔</button></div>`
        : `<div class="row">${x.opts.map((o,k)=>`<button class="ghost" style="font-size:30px;min-width:90px" data-o="${k}" ${done||wrongOpts.includes(k)?"disabled":""}>${o}</button>`).join("")}</div>`;
      view(`<div class="card"><h2>🔢 Question ${i+1}/${qs.length}</h2>
        <div class="bar"><div style="width:${i/qs.length*100}%"></div></div>
        ${x.vis||""}<div class="mq">${x.q}</div>
        <button id="say">🔊 Read it to me</button>
        <div class="msg ${cls||""}">${msg||""}</div>${body}</div>`, ()=>{
          $("#say").onclick = ()=>speak(x.say);
          $$("[data-n]").forEach(b=>b.onclick=()=>press(b.dataset.n));
          const dl = $("#del"); if(dl) dl.onclick = ()=>{ if(!done){ typed = typed.slice(0,-1); draw(); } };
          const go = $("#go"); if(go) go.onclick = submit;
          $$("[data-o]").forEach(b=>b.onclick=()=>choose(b.dataset.o));
          document.onkeydown = e=>{ if(x.type!=="num"||done) return; if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==="Backspace"){ typed = typed.slice(0,-1); draw(); } else if(e.key==="Enter") submit(); };
        });
    }
    function press(n){ if(done || typed.length>=3) return; typed += n; draw(); }
    function right(){
      done = true; const pts = attempts===0?8:attempts===1?4:2; if(attempts===0){ run.first++; stat("m:"+x.key).ok++; }
      run.pts += pts; addPoints(pts); sndGood(); draw(`Yes! ${x.why||""} +${pts} ⭐`, "good-t"); later(()=>{ i++; ask(); }, 1600);
    }
    function wrong(giveUp){
      attempts++; sndBad(); if(attempts===1) stat("m:"+x.key).miss++;
      if(giveUp){ done = true; draw(`The answer is ${x.ans}. ${x.why||""}`, "bad-t"); later(()=>{ i++; ask(); }, 3000); }
      else { typed = ""; draw("Not quite. Have another go!", "bad-t"); }
    }
    function submit(){ if(done || !typed) return; if(+typed === x.ans) right(); else wrong(attempts>=2); }
    function choose(k){ if(done) return; if(String(x.opts[k]) === String(x.ans)) right(); else { wrongOpts.push(+k); wrong(attempts>=Math.min(2,x.opts.length-2)); } }
    draw(); later(()=>speak(x.say), 250);
  }
  ask();
};

/* =============================================================
   CHAPTER 4: PICTURE QUEST (see it, say it, spell it)
   ============================================================= */
MENU.c4 = ()=>levelMenu("c4", PICTURE_LEVELS.map(l=>l.name));
RUN.c4 = level=>{
  const pool = PICTURE_LEVELS[level-1].items;
  const weak = pool.filter(x=>isWeak("p:"+x[0]));
  const qs = [...new Map([...pick(weak,3), ...shuffle(pool)].map(x=>[x[0],x])).values()].slice(0, 8);
  const run = {pts:0, first:0}; let i = 0;
  function q(){
    if(i >= qs.length) return finishScreen("c4", level, run, run.first/qs.length, 0.7, 0.4);
    const [word, emoji] = qs[i];
    spellStep({word, emoji, title:`🖼️ What is it? ${i+1}/${qs.length}`, progress:i/qs.length, say:true, noAudio:true, hint:"Say the word if you can, then spell it!"+(PICTURE_LEVELS[level-1].rule?`<div class="rulebox">📘 ${PICTURE_LEVELS[level-1].rule}</div>`:"")}, r=>{
      const pts = spellPoints(r, 10);
      if(r.mistakes===0 && !r.usedHint){ run.first++; stat("p:"+word).ok++; } else stat("p:"+word).miss++;
      run.pts += pts; addPoints(pts); i++; q();
    });
  }
  q();
};

/* =============================================================
   CHAPTER 5: DIGRAPH DETECTIVE (pick the missing digraph)
   ============================================================= */
MENU.c5 = ()=>levelMenu("c5", DETECTIVE.map(l=>l.name));
RUN.c5 = level=>{
  const pool = DETECTIVE[level-1].items, allD = uniq(pool.map(x=>x[0]));
  const weak = pool.filter(x=>isWeak("d:"+x[1]));
  const qs = [...new Map([...pick(weak,3), ...shuffle(pool)].map(x=>[x[1],x])).values()].slice(0, CONFIG.questionsPerRound);
  const run = {pts:0, first:0}; let i = 0;
  function q(){
    if(i >= qs.length) return finishScreen("c5", level, run, run.first/qs.length, 0.8, 0.5);
    const [dg, word, emoji] = qs[i], at = word.indexOf(dg);
    const lvD = [...new Set(pool.map(x=>x[0]))].filter(d=>d!==dg), others = lvD.length>=3 ? lvD : [...lvD, ...allD.filter(d=>d!==dg && !lvD.includes(d))];
    const opts = shuffle([dg, ...pick(others, 3)]);
    let attempts = 0, done = false, wrongPicks = [];
    function draw(msg, cls){
      view(`<div class="card"><h2>Find the digraph ${i+1}/${qs.length}</h2>
        <div class="bar"><div style="width:${i/qs.length*100}%"></div></div>
        ${DETECTIVE[level-1].rule?`<div class="rulebox">📘 ${DETECTIVE[level-1].rule}</div>`:""}<div class="big">${emoji||"🔊"}</div>
        <div class="letters" style="margin:6px 0">${word.slice(0,at).split("").map(c=>`<div class="lt">${c}</div>`).join("")}<div class="lt ${done?"good":"blank"}" style="min-width:${done?64:90}px;width:auto;padding:0 10px">${done?dg:"?"}</div>${word.slice(at+dg.length).split("").map(c=>`<div class="lt">${c}</div>`).join("")}</div>
        <button id="say">🔊 Hear the word</button>
        <div class="msg ${cls||""}">${msg||""}</div>
        <div class="row">${opts.map(o=>`<button class="ghost" style="font-size:36px;min-width:110px" data-o="${o}" ${done||wrongPicks.includes(o)?"disabled":""}>${o}</button>`).join("")}</div></div>`, ()=>{
          $("#say").onclick = ()=>speak(word);
          $$("[data-o]").forEach(b=>b.onclick=()=>choose(b.dataset.o));
        });
    }
    function choose(o){
      if(done) return;
      if(o===dg){
        done = true; const pts = attempts===0?10:attempts===1?5:2; if(attempts===0){ run.first++; stat("d:"+word).ok++; }
        run.pts+=pts; addPoints(pts); sndGood(); speak(word);
        draw(`Yes! ${word} (+${pts} ⭐)`, "good-t"); later(()=>{ i++; q(); }, 1400);
      } else {
        attempts++; wrongPicks.push(o); sndBad(); if(attempts===1) stat("d:"+word).miss++;
        if(attempts>=3){ done = true; draw(`It's "${dg}" in ${word}.`, "bad-t"); speak(word); later(()=>{ i++; q(); }, 2600); }
        else { draw("Not quite. Listen and try again!", "bad-t"); speak(word); }
      }
    }
    draw(); later(()=>speak(word), 250);
  }
  q();
};

/* =============================================================
   GROWN-UP CORNER
   ============================================================= */
function grownUp(){ if(!askPin()) return; showGrownUp(); }
function showGrownUp(){
  const p = P();
  const rows = Object.entries(p.stats).map(([k,v])=>({k, ...v})).filter(r=>r.miss>0).sort((a,b)=>b.miss-a.miss);
  const label = k => /^m:/.test(k) ? "maths: "+k.slice(2) : /^[wdpx]:/.test(k) ? k.slice(2) : "sound “"+k.split(":")[1]+"” ("+k.split(":")[2]+")";
    view(`<div class="card" style="text-align:left"><h2>👩‍👧 Grown-up corner: ${esc(p.name)}</h2>
    <h3>Levels reached</h3><p style="font-size:18px">${CHS.map(ch=>`${CH[ch].icon} ${CH[ch].name}: ${CH[ch].daily?"times finished "+(p.c6&&p.c6.count||0):"level "+todayLevel(p,ch)+" of "+CH[ch].max}`).join("<br>")}</p>
    <h3>Needs more practice</h3>
    <p style="font-size:18px">${rows.length ? rows.map(r=>`<b>${esc(label(r.k))}</b> (missed ${r.miss}, right ${r.ok})`).join(" · ") : "Nothing yet!"}</p>
    <h3>Auto-save file</h3><p style="font-size:18px">${FS.state==="unsupported"?"Not available in this browser. Use Chrome or Edge on the laptop.":FS.state==="ready"?"✅ On. Progress is saved to a file on this computer after every change, so clearing the browser will not lose it.":FS.state==="needs"?"⏸ Paused. Tap the button to turn it back on.":"Not set up yet. Choose a file once (for example in Documents) and progress saves there automatically."}</p>${FS.state==="none"?`<button class="small ok" id="fsPick">💾 Choose auto-save file</button>`:""}${FS.state==="needs"?`<button class="small ok" id="fsOn2">▶ Turn auto-save on</button>`:""}${FS.state==="ready"?`<button class="small ghost" id="fsPick">Change file</button>`:""}
    <h3>Backup</h3><p style="font-size:18px">Last backup: <b>${p.lastBackup||"never"}</b>. The home screen reminds you each week.</p><h3>Sound checking</h3><p style="font-size:18px">Currently: <b>${p.micMode==="mic"?"microphone listens":"grown-up taps “She said it”"}</b>. Change it in Chapter 2 → All levels.</p>
    <div class="row"><button class="small" id="exp">💾 Save a backup file</button><button class="small ghost" id="imp">📂 Restore from backup</button></div>
    <input type="file" id="file" accept=".json" style="display:none">
    <button class="small alt" id="del">Delete this player</button></div>`, ()=>{
      $("#del").onclick = ()=>{ if(confirm("Delete "+p.name+" and all their progress?")){ DB.profiles = DB.profiles.filter(x=>x.id!==p.id); DB.current = null; saveDB(); profilesScreen(); } };
      $("#exp").onclick = ()=>{ downloadBackup(); showGrownUp(); };
      const fp = $("#fsPick"); if(fp) fp.onclick = async()=>{ await fsPick(); showGrownUp(); };
      const f2 = $("#fsOn2"); if(f2) f2.onclick = async()=>{ await fsAllow(); showGrownUp(); };
      $("#imp").onclick = ()=>$("#file").click();
      $("#file").onchange = e=>{
        const f = e.target.files[0]; if(!f) return;
        const r = new FileReader();
        r.onload = ()=>{ try{ const d = JSON.parse(r.result); if(!d.profiles) throw 0; d.profiles.forEach(ensure); DB = d; saveDB(); alert("Backup restored!"); profilesScreen(); }catch(err){ alert("That file doesn't look like a Little Explorers Quest backup."); } };
        r.readAsText(f);
      };
    });
}

/* =============================================================
   START
   ============================================================= */
fsInit().then(()=>{ if(DB.profiles.length===0 && FS.handle) createProfile(); else if(FS.state==="needs" && P() && document.querySelector("#closet")) home(); });
if(DB.profiles.length === 0){ applyTheme(); createProfile(); }
else if(DB.profiles.length === 1){ DB.current = DB.profiles[0].id; home(); }
else profilesScreen();
</script>
